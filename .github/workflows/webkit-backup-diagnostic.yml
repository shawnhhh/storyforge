name: Inspect WebKit backup draft failure
on:
  push:
    paths:
      - .github/workflows/webkit-backup-diagnostic.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40276878763
          name: macos-writing-webkit-40276878763
          path: work/original-webkit
      - name: Emit structural trace metrics without raw document or identifiers
        run: |
          python - <<'PY'
          import collections, json, pathlib, zipfile
          root = pathlib.Path('work/original-webkit')
          failure = next(p.parent for p in root.rglob('trace.zip') if 'draft-recovery-restoring-a-' in str(p))
          archive = zipfile.ZipFile(failure / 'trace.zip')
          events = []
          for name in archive.namelist():
              if name.endswith(('.trace', '.network')):
                  events += [json.loads(line) for line in archive.read(name).decode().splitlines()]
          frames = collections.defaultdict(list)
          rows = []
          def emit(kind, **data): rows.append({'kind': kind, **data})
          def isnode(node): return isinstance(node, list) and node and isinstance(node[0], str)
          def raw_nodes(node, result):
              if isinstance(node, str): result.append(node)
              elif isnode(node):
                  for child in node[2:]: raw_nodes(child, result)
                  result.append(node)
          def resolve(node, index, snapshots):
              if isinstance(node, list) and node and isinstance(node[0], list):
                  delta, position = node[0]
                  target = index - delta
                  return resolve(snapshots[target]['nodes'][position], target, snapshots)
              if isnode(node): return [node[0], node[1] if len(node) > 1 else {}, *[resolve(child, index, snapshots) for child in node[2:]]]
              return node
          def text(node):
              if isinstance(node, str): return node
              return ''.join(text(child) for child in node[2:]) if isnode(node) else ''
          def walk(node):
              if isnode(node):
                  yield node
                  for child in node[2:]: yield from walk(child)
          def schema_token(value):
              import re
              return value if isinstance(value, str) and re.fullmatch(r'[A-Za-z][A-Za-z.:]{0,50}', value) else 'other'
          emit('schema-counts', types=dict(collections.Counter(schema_token(event.get('type')) for event in events)), methods=dict(collections.Counter(schema_token(event.get('method')) for event in events if event.get('type') == 'event')))
          for event in events:
              kind = event.get('type')
              if kind == 'before':
                  params = event.get('params', {})
                  value = str(params.get('value', ''))
                  selector = str(params.get('selector', ''))
                  label = ('saved-prose' if value == '备份之后已保存的虚构内容' else 'unsaved-prose' if value == '备份之后尚未保存的虚构草稿' else 'prose-control' if '小说正文' in selector else 'save-status' if 'save-status' in selector else 'first-chapter' if '第一章' in selector else 'recovery-choice' if '恢复此草稿' in selector else 'other')
                  method = event.get('method')
                  if method not in ['fill', 'click', 'expect', 'route', 'unroute', 'close', 'reload', 'goto', 'newPage', 'newContext', 'get', 'post', 'json']: method = 'other'
                  emit('action', time=event.get('startTime'), call=event.get('callId'), method=method, label=label)
              elif kind == 'after':
                  error = str(event.get('error', ''))
                  emit('action-end', time=event.get('endTime'), call=event.get('callId'), error=bool(event.get('error')), target_closed='closed' in error.lower(), crash='crash' in error.lower(), timeout='timeout' in error.lower())
              elif kind == 'event':
                  method = event.get('method')
                  if method in ['close', 'crash', 'pageError', 'pageerror', 'dialog', 'frameNavigated', 'navigated']:
                      emit('browser-event', time=event.get('time'), method=method)
              elif kind == 'log':
                  value = str(event.get('message', ''))
                  emit('action-log', time=event.get('time'), call=event.get('callId'), target_closed='closed' in value.lower(), crash='crash' in value.lower(), detached='detach' in value.lower())
              elif kind == 'console':
                  value = str(event.get('text', ''))
                  emit('console-classification', time=event.get('time'), vite_reload='reload' in value.lower() and 'vite' in value.lower(), vite_connect='vite' in value.lower() and 'connect' in value.lower(), error=event.get('messageType') == 'error')
              elif kind == 'frame-snapshot':
                  snap = event['snapshot']; group = frames[snap['frameId']]
                  nodes = []; raw_nodes(snap['html'], nodes)
                  group.append({'raw': snap['html'], 'nodes': nodes})
                  dom = resolve(snap['html'], len(group) - 1, group)
                  flattened = list(walk(dom)); visible_text = text(dom)
                  bodies = [node for node in flattened if node[1].get('aria-label') == '小说正文']
                  titles = [node[1].get('__playwright_value_', node[1].get('value')) for node in flattened if node[1].get('aria-label') == '章节标题']
                  emit('frame', time=snap.get('timestamp'), call=snap.get('callId'), phase=snap.get('phase'), prose_count=len(bodies), editable=[node[1].get('contenteditable') == 'true' for node in bodies], saved_prose=[text(node) == '备份之后已保存的虚构内容' for node in bodies], draft_prose=[text(node) == '备份之后尚未保存的虚构草稿' for node in bodies], title_first='第一章' in titles, title_second='第二章' in titles, saved='已保存到数据库' in visible_text, recovery_choice='恢复此草稿' in visible_text, draft_protected='临时草稿已保护' in visible_text, disabled_fieldsets=sum(node[0].upper() == 'FIELDSET' and 'disabled' in node[1] for node in flattened))
              elif kind == 'resource-snapshot':
                  snap = event['snapshot']; req = snap['request']; url = req['url']
                  label = next((label for label, token in [('restore', '/restore'), ('backup', '/backups'), ('chapters', '/chapters'), ('novels', '/novels')] if token in url), None)
                  if label: emit('request', time=snap.get('_monotonicTime'), elapsed=snap.get('time'), label=label, method=req['method'], status=snap['response']['status'])
          emit('archive', trace_files=sum(name.endswith('.trace') for name in archive.namelist()), screenshots=sum(name.endswith(('.png', '.jpeg')) for name in archive.namelist()), failure_screenshot=(failure / 'test-failed-1.png').exists())
          pathlib.Path('work/webkit-structural-summary.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2))
          for row in rows: print('METRIC ' + json.dumps(row, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-backup-structural-evidence
          path: work/webkit-structural-summary.json
          retention-days: 14
  reproduce:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Repeat unchanged backup recovery assertions twenty times
        run: |
          mkdir -p work
          DEBUG=pw:browser npm run test:e2e -- --project=webkit draft-recovery.spec.ts --grep 'restoring an isolated database backup' --repeat-each=20 > work/webkit-backup-browser.log 2>&1
      - name: Retain browser process logs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-backup-live-diagnostics
          path: |
            work/webkit-backup-browser.log
            work/e2e-results/
          retention-days: 14
