name: StoryForge checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Upload large-library performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-planning-performance-${{ github.event_name }}-${{ github.run_id }}
          path: |
            work/ai-planning-performance.json
            work/ai-planning-performance-last-measurement.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated browser crash recovery three times
        run: npm run test:e2e -- --project=chromium draft-recovery.spec.ts --grep 'persistent browser profile' --repeat-each=3
      - name: Focus, AI selection and dialog focus regression
        run: npm run test:e2e -- --project=chromium focus-writing editor-experience autosave-scroll ai-writing search-preferences
      - name: AI planning full-stack Mock E2E
        run: npm run test:e2e -- --mock-planning --project=chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.event_name }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
  macos-writing:
    name: macOS writing (${{ matrix.browser }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            project: chromium
            channel: chrome
          - browser: webkit
            project: webkit
            channel: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - name: AI planning full-stack Mock E2E
        run: npm run test:e2e -- --mock-planning --project=${{ matrix.project }}
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Verify queued revision replacement five times
        run: npm run test:e2e -- --project=${{ matrix.project }} focus-writing --grep 'focus toggles retain the in-flight queue' --repeat-each=5
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      # Real Google Chrome channel and Playwright WebKit on macOS. WebKit is not
      # the installed Safari app; retain the real Safari manual checklist.
      - run: npm run test:e2e -- --project=${{ matrix.project }} focus-writing editor-experience autosave-scroll ai-writing search-preferences
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Full E2E on macOS browser
        run: npm run test:e2e -- --project=${{ matrix.project }}
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Upload macOS browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-writing-${{ matrix.browser }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Firefox planning and writing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: AI planning full-stack Mock E2E (Firefox)
        run: npm run test:e2e -- --mock-planning --project=firefox
      - name: Writing regression (Firefox)
        run: npm run test:e2e -- --project=firefox focus-writing editor-experience autosave-scroll ai-writing search-preferences
      - name: Full E2E (Firefox)
        run: npm run test:e2e -- --project=firefox
      - name: Upload Firefox diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-${{ github.event_name }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
