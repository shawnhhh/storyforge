name: StoryForge checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Preserve beta build inventory and frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: beta-build-linux-${{ github.run_id }}
          path: |
            dist/
            work/beta-build-manifest.json
            package-lock.json
            package.json
          retention-days: 14
      - name: Install media validator
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: npm test
      - name: Unified candidate data safety and beta lifecycle
        run: npm run test:safety
      - name: Migration, trash, backup and draft safety regression
        run: node --import tsx --test server/tests/trash*.test.ts server/tests/planning-timeline.test.ts server/tests/planning-migrations.test.ts server/tests/restore-crash.test.ts tests/unit/draft-protection.test.ts tests/unit/draft-open.test.ts tests/unit/planning-recovery.test.ts
      - name: Upload large-library performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-planning-performance-${{ github.event_name }}-${{ github.run_id }}
          path: |
            work/ai-planning-performance.json
            work/ai-planning-performance-last-measurement.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - name: IME form-control regression
        run: npm run test:e2e -- --project=chromium planning story-bible --grep composition
      - name: Verify live AI theme idle and hover colors first
        run: npm run test:e2e -- --project=chromium writing-ui.spec.ts --grep 'AI writing and review follow explicit and live system themes'
      - name: Verify isolated browser crash recovery three times
        run: npm run test:e2e -- --project=chromium draft-recovery.spec.ts --grep 'persistent browser profile' --repeat-each=3
      - name: Planning, timeline and draft recovery regression
        run: npm run test:e2e -- --project=chromium planning timeline trash draft-recovery
      - name: Focus, AI selection and dialog focus regression
        run: npm run test:e2e -- --project=chromium focus-writing editor-experience autosave-scroll ai-writing ai-consistency-review writing-ui search-preferences
      - name: AI planning full-stack Mock E2E
        run: npm run test:e2e -- --mock-planning --project=chromium
      - name: Repeat mobile fallback recovery ten times
        run: npm run test:e2e -- --project=chromium draft-recovery.spec.ts --grep 'mobile recovery works with IndexedDB disabled' --repeat-each=10
      - name: Repeat planning deletion and delayed-material safety five times
        run: npm run test:e2e -- --project=chromium planning.spec.ts --grep 'outline tree CRUD|late material loading' --repeat-each=5
      - name: Upload browser diagnostics and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.event_name }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
  chromium:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Chromium complete regression (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Keep the complete suite and deadlines; each runner owns its services,
      # database and diagnostics, without competing browser workers.
      - name: Full E2E (Chromium shard ${{ matrix.shard }}/3)
        run: npm run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/3
      - name: Upload Chromium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-${{ matrix.shard }}-${{ github.event_name }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
  macos-writing:
    name: macOS writing (${{ matrix.browser }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            project: chromium
            channel: chrome
          - browser: webkit
            project: webkit
            channel: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Preserve beta build inventory and frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: beta-build-macos-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            dist/
            work/beta-build-manifest.json
            package-lock.json
            package.json
          retention-days: 14
      - name: Install media validator
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: npm test
      - name: Unified candidate data safety and beta lifecycle
        run: npm run test:safety
      - name: Migration, trash, backup and draft safety regression
        run: node --import tsx --test server/tests/trash*.test.ts server/tests/planning-timeline.test.ts server/tests/planning-migrations.test.ts server/tests/restore-crash.test.ts tests/unit/draft-protection.test.ts tests/unit/draft-open.test.ts tests/unit/planning-recovery.test.ts
      - run: npx playwright install ${{ matrix.browser }}
      - name: IME form-control regression
        run: npm run test:e2e -- --project=${{ matrix.project }} planning story-bible --grep composition
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: AI planning full-stack Mock E2E
        run: npm run test:e2e -- --mock-planning --project=${{ matrix.project }}
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Verify live AI theme idle and hover colors first
        run: npm run test:e2e -- --project=${{ matrix.project }} writing-ui.spec.ts --grep 'AI writing and review follow explicit and live system themes'
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Verify isolated browser profile with the selected channel
        run: npm run test:e2e -- --project=${{ matrix.project }} draft-recovery.spec.ts --grep 'persistent browser profile'
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Verify queued revisions and failed-save drafts five times
        run: npm run test:e2e -- --project=${{ matrix.project }} focus-writing --grep 'focus toggles retain the in-flight queue|focus autosave failures retain drafts' --repeat-each=5
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      # Real Google Chrome channel and Playwright WebKit on macOS. WebKit is not
      # the installed Safari app; retain the real Safari manual checklist.
      - run: npm run test:e2e -- --project=${{ matrix.project }} focus-writing editor-experience autosave-scroll ai-writing ai-consistency-review writing-ui search-preferences
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Planning, timeline and draft recovery regression
        run: npm run test:e2e -- --project=${{ matrix.project }} planning timeline trash draft-recovery
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Repeat mobile fallback recovery ten times
        run: npm run test:e2e -- --project=${{ matrix.project }} draft-recovery.spec.ts --grep 'mobile recovery works with IndexedDB disabled' --repeat-each=10
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Repeat planning deletion and delayed-material safety five times
        run: npm run test:e2e -- --project=${{ matrix.project }} planning.spec.ts --grep 'outline tree CRUD|late material loading' --repeat-each=5
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Repeat isolated backup draft recovery five times (WebKit)
        if: matrix.browser == 'webkit'
        run: npm run test:e2e -- --project=webkit draft-recovery.spec.ts --grep 'restoring an isolated database backup' --repeat-each=5
      # Keep all tests and their original deadlines. Fresh isolated services per
      # shard prevent accumulated restore fixtures from exhausting one 900s run.
      - name: Complete browser regression (three isolated shards)
        run: |
          npm run test:e2e -- --project=${{ matrix.project }} --shard=1/3
          npm run test:e2e -- --project=${{ matrix.project }} --shard=2/3
          npm run test:e2e -- --project=${{ matrix.project }} --shard=3/3
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Upload macOS browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-writing-${{ matrix.browser }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Firefox planning and writing (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Start virtual audio output for headless Firefox
        run: bash tests/e2e/setup-linux-audio.sh
      - name: IME form-control regression (Firefox)
        if: matrix.shard == 1
        run: npm run test:e2e -- --project=firefox planning story-bible --grep composition
      - name: AI planning full-stack Mock E2E (Firefox)
        if: matrix.shard == 1
        run: npm run test:e2e -- --mock-planning --project=firefox
      - name: Writing regression (Firefox)
        if: matrix.shard == 1
        run: npm run test:e2e -- --project=firefox focus-writing editor-experience autosave-scroll ai-writing ai-consistency-review writing-ui search-preferences
      - name: Repeat mobile fallback recovery ten times (Firefox)
        if: matrix.shard == 1
        run: npm run test:e2e -- --project=firefox draft-recovery.spec.ts --grep 'mobile recovery works with IndexedDB disabled' --repeat-each=10
      - name: Repeat planning deletion and delayed-material safety five times (Firefox)
        if: matrix.shard == 1
        run: npm run test:e2e -- --project=firefox planning.spec.ts --grep 'outline tree CRUD|late material loading' --repeat-each=5
      # Separate runners avoid competing browsers and restart the isolated services.
      # All three shards together run the complete suite, with the original deadlines.
      - name: Full E2E (Firefox shard ${{ matrix.shard }}/3)
        run: npm run test:e2e -- --project=firefox --shard=${{ matrix.shard }}/3
      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-${{ matrix.shard }}-${{ github.event_name }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
