name: StoryForge checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.event_name }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
  macos-writing:
    name: macOS writing (${{ matrix.browser }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            project: chromium
            channel: chrome
          - browser: webkit
            project: webkit
            channel: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      # Real Google Chrome channel and Playwright WebKit on macOS. WebKit is not
      # the installed Safari app; retain the real Safari manual checklist.
      - run: npm run test:e2e -- --project=${{ matrix.project }} focus-writing editor-experience autosave-scroll ai-writing search-preferences
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - name: Upload macOS browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-writing-${{ matrix.browser }}-${{ github.run_id }}
          path: work/e2e-results/
          if-no-files-found: ignore
          retention-days: 7
