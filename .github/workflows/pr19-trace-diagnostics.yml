name: Inspect PR19 captured WebKit trace
on:
  push:
    branches: [integration/storyforge-planning-trash-20261018]
    paths: [.github/workflows/pr19-trace-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39094433137
          name: macos-writing-webkit-39094433137
          path: captured
      - name: Read captured failure context and trace actions
        shell: python
        run: |
          import json
          import pathlib
          import zipfile
          root = pathlib.Path('captured')
          for path in root.rglob('error-context.md'):
              print('FAILURE CONTEXT', path)
              print(path.read_text()[:16000])
          for path in root.rglob('trace.zip'):
              print('TRACE', path)
              with zipfile.ZipFile(path) as archive:
                  for name in archive.namelist():
                      if not name.endswith('.trace'):
                          continue
                      events = [json.loads(line) for line in archive.read(name).splitlines()]
                      for event in events:
                          if event.get('type') in ('before', 'after', 'log'):
                              if event.get('type') == 'before' or event.get('error') or event.get('message'):
                                  print('ACTION', json.dumps(event, ensure_ascii=False)[:2200])
                      snapshots = [event for event in events if event.get('type') == 'frame-snapshot']
                      def text(node):
                          if isinstance(node, str):
                              return node
                          if not isinstance(node, list):
                              return ''
                          if node and isinstance(node[0], str) and node[0].upper() in ('SCRIPT', 'STYLE'):
                              return ''
                          return ' '.join(text(child) for child in node[2:] if isinstance(child, (str, list)))
                      for event in snapshots:
                          snapshot = event.get('snapshot', {})
                          html = snapshot.get('html', [])
                          value = text(html)
                          if '专注模式不能丢失的草稿' in value or '风起云涌' in value:
                              print('SNAPSHOT', snapshot.get('snapshotName'), snapshot.get('timestamp'), value[:7000])
