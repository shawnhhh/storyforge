name: Composition protocol acceptance
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
            install: chromium
            channel: ''
          - os: ubuntu-latest
            browser: firefox
            install: firefox
            channel: ''
          - os: macos-latest
            browser: chromium
            install: chrome
            channel: chrome
          - os: macos-latest
            browser: webkit
            install: webkit
            channel: ''
    runs-on: ${{ matrix.os }}
    name: Composition ${{ matrix.os }} ${{ matrix.install }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install media validator
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - name: Start virtual audio output for headless Firefox
        if: runner.os == 'Linux' && matrix.browser == 'firefox'
        run: bash tests/e2e/setup-linux-audio.sh
      - run: npm run test:e2e -- composition.spec.ts --project=${{ matrix.browser }}
        env:
          E2E_CHROMIUM_CHANNEL: ${{ matrix.channel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-${{ matrix.os }}-${{ matrix.install }}-${{ github.run_id }}
          path: work/e2e-results/
          retention-days: 7
