name: Inspect historical Firefox planning deletion
on:
  push:
    paths:
      - .github/workflows/planning-delete-diagnostic.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40260716963
          name: firefox-2-pull_request-40260716963
          path: work/original-firefox
      - name: Decode snapshots and emit only structural test metrics
        run: |
          python - <<'PY'
          import collections, json, pathlib, struct, zipfile
          root = pathlib.Path('work/original-firefox')
          failure = next(p.parent for p in root.rglob('trace.zip') if 'planning-outline-tree-CRUD-' in str(p))
          archive = zipfile.ZipFile(failure / 'trace.zip')
          events = []
          for name in archive.namelist():
              if name.endswith(('.trace', '.network')):
                  events += [json.loads(line) for line in archive.read(name).decode().splitlines()]
          frames = collections.defaultdict(list)
          output = []
          def emit(kind, **data):
              output.append({'kind': kind, **data})
          def isnode(node): return isinstance(node, list) and node and isinstance(node[0], str)
          def raw_nodes(node, result):
              if isinstance(node, str): result.append(node)
              elif isnode(node):
                  for child in node[2:]: raw_nodes(child, result)
                  result.append(node)
          def resolve(node, index, snapshots):
              if isinstance(node, list) and node and isinstance(node[0], list):
                  delta, position = node[0]
                  target = index - delta
                  return resolve(snapshots[target]['nodes'][position], target, snapshots)
              if isnode(node): return [node[0], node[1] if len(node) > 1 else {}, *[resolve(child, index, snapshots) for child in node[2:]]]
              return node
          def text(node):
              if isinstance(node, str): return node
              return ''.join(text(child) for child in node[2:]) if isnode(node) else ''
          def walk(node):
              if isnode(node):
                  yield node
                  for child in node[2:]: yield from walk(child)
          for event in events:
              kind = event.get('type')
              if kind == 'before':
                  selector = str(event.get('params', {}).get('selector', ''))
                  label = next((label for label, token in [('select-target-outline', '第二卷：归来'), ('delete-menu-summary', 'summary'), ('delete-planning', '删除当前规划'), ('linked-chapter-check', '关联章节')] if token in selector), None)
                  if label: emit('action', time=event.get('startTime'), call=event.get('callId'), method=event.get('method'), label=label)
              elif kind == 'after':
                  emit('action-end', time=event.get('endTime'), call=event.get('callId'), error=bool(event.get('error')), point=event.get('point'))
              elif kind == 'frame-snapshot':
                  snap = event['snapshot']; group = frames[snap['frameId']]
                  nodes = []; raw_nodes(snap['html'], nodes)
                  group.append({'raw': snap['html'], 'nodes': nodes})
                  dom = resolve(snap['html'], len(group) - 1, group)
                  flattened = list(walk(dom)); visible_text = text(dom)
                  menus = [node for node in flattened if node[0].upper() == 'DETAILS' and '删除当前规划' in text(node)]
                  titles = [node[1].get('__playwright_value_', node[1].get('value')) for node in flattened if node[0].upper() == 'INPUT']
                  selected = next((name for name in ['第二卷：归来', '第一卷：启程', '总纲：寻星'] if name in titles), None)
                  emit('frame', time=snap.get('timestamp'), call=snap.get('callId'), phase=snap.get('phase'), name=snap.get('snapshotName', snap.get('name')), delete_menus=len(menus), menu_open=['open' in node[1] for node in menus], materials_placeholder='资料尚未加载' in visible_text, materials_groups=sum(label in visible_text for label in ['关联人物', '关联地点', '其他关联资料']), recovery_choice='恢复此草稿' in visible_text, saved='已保存到数据库' in visible_text, selected=selected, disabled_fieldsets=sum(node[0].upper() == 'FIELDSET' and 'disabled' in node[1] for node in flattened), planning_items=sum(node[0].upper() == 'ARTICLE' for node in flattened))
              elif kind == 'resource-snapshot':
                  snap = event['snapshot']; req = snap['request']; url = req['url']
                  label = next((label for label, token in [('planning', '/planning'), ('materials', '/story-bible'), ('knowledge', '/knowledge')] if token in url), None)
                  if label: emit('request', time=snap.get('_monotonicTime'), elapsed=snap.get('time'), label=label, method=req['method'], status=snap['response']['status'])
          png = (failure / 'test-failed-1.png').read_bytes()
          emit('screenshot', dimensions=struct.unpack('>II', png[16:24]))
          pathlib.Path('work/diagnostic-summary.json').write_text(json.dumps(output, ensure_ascii=False, indent=2))
          for row in output: print('METRIC ' + json.dumps(row, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-planning-structural-evidence
          path: work/diagnostic-summary.json
          retention-days: 14
